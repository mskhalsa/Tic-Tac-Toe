version: '3'
services:
  app:
    build:
      context: ./tic_tac_toe_service
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    environment:
      FLASK_ENV: production
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
    depends_on:
      - redis
    volumes:
      - ./tic_tac_toe_service:/app
  
  redis:
    image: "redis:alpine"
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  redis_data:
